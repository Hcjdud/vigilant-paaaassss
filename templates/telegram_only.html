<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vailae — доступ через Telegram</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:linear-gradient(135deg,#6366f1,#10b981);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            padding:20px;
        }
        .card{
            max-width:400px;
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(10px);
            border-radius:30px;
            padding:40px;
            text-align:center;
        }
        h1{font-size:48px;margin-bottom:20px;}
        p{margin-bottom:30px;opacity:0.9;}
        .btn{
            display:inline-flex;
            align-items:center;
            gap:10px;
            background:#0088cc;
            color:white;
            text-decoration:none;
            padding:16px 32px;
            border-radius:50px;
            font-size:18px;
            font-weight:600;
        }
        .btn:hover{transform:translateY(-2px);}
    </style>
</head>
<body>
    <div class="card">
        <h1>VAILAE</h1>
        <p>Сайт доступен только через Telegram бота</p>
        <a href="https://t.me/{{ bot_username }}" class="btn">
            Открыть в Telegram
        </a>
    </div>
</body>
</html>
