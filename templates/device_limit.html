<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vailae — лимит устройств</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:linear-gradient(135deg,#f59e0b,#ef4444);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            padding:20px;
        }
        .card{
            max-width:400px;
            background:rgba(0,0,0,0.2);
            backdrop-filter:blur(10px);
            border-radius:30px;
            padding:40px;
            text-align:center;
        }
        h1{font-size:32px;margin-bottom:20px;}
        .limit{font-size:48px;font-weight:700;margin:20px 0;}
        .btn{
            display:inline-block;
            background:white;
            color:#ef4444;
            text-decoration:none;
            padding:16px 32px;
            border-radius:50px;
            font-weight:600;
            margin-top:20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📱 Лимит устройств</h1>
        <p>Подписка может использоваться только на {{ max_devices }} устройствах</p>
        <div class="limit">{{ max_devices }} / {{ max_devices }}</div>
        <p>Чтобы использовать на новом устройстве, удалите одно из старых</p>
        <a href="/dashboard" class="btn">Управлять устройствами</a>
    </div>
</body>
</html>
